name: Validate
on:
  pull_request:
  push:
    branches: [dev, main]
permissions:
  contents: read
concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  go:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ['1.25.x', '1.26.x', '1.27.x']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          check-latest: true
          cache-dependency-path: |
            go.sum
            benchmarks/go.sum
      - run: go test -race ./...
      - run: go vet ./...
      - run: go test -race ./...
        working-directory: benchmarks
      - run: go test -race -run '^$' -bench '^BenchmarkParallel' -benchtime 100x ./...
        working-directory: benchmarks
      - if: matrix.go == '1.27.x'
        run: go test -run '^$' -fuzz '^FuzzRoutingCacheEquivalence$' -fuzztime 10s
  analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.x'
          check-latest: true
      - run: go install honnef.co/go/tools/cmd/staticcheck@v0.8.1
      - run: staticcheck ./... && staticcheck -tests=false ./...
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
      - run: govulncheck ./...
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.x'
          check-latest: true
      - run: npm ci
        working-directory: website
      - run: npm run check:site
        working-directory: website
      - run: npm run check:examples
        working-directory: website
      - run: npm audit --audit-level=low
        working-directory: website
