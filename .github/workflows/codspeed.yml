name: CodSpeed
# Manual only for now: a run takes about 20 minutes on a shared runner, whose
# walltime numbers are too noisy to gate PRs. To turn it back on, add
# pull_request and push (branches: [dev]) triggers.
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write # Required for OIDC authentication with CodSpeed
concurrency:
  group: codspeed-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  benchmarks:
    name: Run benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.x'
          # Zinc requires no modules, so only the benchmark suite has a go.sum.
          cache-dependency-path: benchmarks/go.sum
      - name: Run the benchmarks
        uses: CodSpeedHQ/action@373d6868929f444bc08d901fd0eb0ad52a8875ea # v5.2.1
        with:
          mode: walltime
          # The root package's benchmarks, then the Zinc half of the
          # head-to-head suite in benchmarks/: the Zinc-only cases and Zinc's
          # run of all 77 scenarios. Gin, Echo and Chi are skipped to keep the
          # run focused on Zinc and within the per-package timeout.
          run: >-
            go test -bench=. . &&
            cd benchmarks &&
            go test -bench='^Benchmark(HTTP|Zinc)' . &&
            go test -bench='^Benchmark[^Z]/^Zinc$' . &&
            go test -bench='^BenchmarkScenario//^Zinc$' .
